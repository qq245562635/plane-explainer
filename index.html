<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>小飞机图解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap">
</head>
<body>
<style>
/* 布局：一张技术图版。左栏是步骤目录，右侧是讲解句、3D 舞台和参数标签，底部是核心原理。 */
:root{
  --paper:#ece6d8; --plate:#f7f3ea; --pad:#f6deb0; --ink:#1c2333; --muted:#6c6f77; --line:#cfc6b3;
  --runway:#3b4252; --accent:#f2b437;
  --accent-soft:color-mix(in srgb,var(--accent) 42%,var(--plate));
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
  --f-hand:"ZCOOL KuaiLe","Noto Sans SC","Kaiti SC",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f141d; --plate:#161d29; --pad:#223047; --ink:#e7e1d4; --muted:#909aa8; --line:#334057; --runway:#141a24; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f141d; --plate:#161d29; --pad:#223047; --ink:#e7e1d4; --muted:#909aa8; --line:#334057; --runway:#141a24; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.plate{max-width:1240px;margin:0 auto;border:2px solid var(--ink);border-radius:14px;background:var(--plate);
  box-shadow:6px 6px 0 var(--ink);display:grid;grid-template-columns:250px minmax(0,1fr);overflow:hidden}
.side{border-right:2px solid var(--ink);padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.fig{font:600 13px/1 var(--f-mono);letter-spacing:.12em;color:var(--muted)}
h1{margin:0;font-size:30px;font-weight:700;line-height:1.2;text-wrap:balance}
.steps{display:flex;flex-direction:column;gap:10px}
.step{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:9px 14px;border:2px solid var(--line);
  border-radius:999px;background:transparent;color:var(--muted);font:500 15px/1.2 var(--f-mono);cursor:pointer;text-align:left;
  transition:background .25s,border-color .25s,color .25s,box-shadow .25s}
.step:hover{border-color:var(--muted);color:var(--ink)}
.step:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.step .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--muted);color:var(--plate);font-size:12px;font-weight:600}
.step.on{border-color:var(--ink);background:var(--accent-soft);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.step.on .n{background:var(--ink)}
.step .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--ink);opacity:.55}
.auto{display:flex;align-items:center;gap:8px;align-self:flex-start;border:0;background:none;color:var(--muted);font:500 13px var(--f-mono);cursor:pointer;padding:4px 0}
.auto:hover{color:var(--ink)}
.auto:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.auto i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .2s}
.auto.on i{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.note{margin-top:auto;font-size:12px;line-height:1.6;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column;gap:12px;padding:20px 24px 18px}
.caption{margin:0;font-size:17px;line-height:1.65;min-height:3.3em;max-width:62ch;transition:opacity .3s}
.stage{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border-radius:6px;overflow:hidden;touch-action:pan-y}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:24px/1 var(--f-hand);color:var(--ink);opacity:0;
  transform:translate(-50%,-100%);text-shadow:0 0 3px var(--pad),0 0 6px var(--pad),0 0 10px var(--pad),2px 2px 0 var(--pad),-2px -2px 0 var(--pad),2px -2px 0 var(--pad),-2px 2px 0 var(--pad)}
.lbl.hot{color:color-mix(in srgb,var(--accent) 55%,var(--ink))}
.lbl.blue{color:#2f7fca}.lbl.red{color:#d9542f}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;gap:8px;align-items:baseline;padding:6px 12px;border:1.5px solid var(--ink);border-radius:6px;font:400 13px/1.2 var(--f-mono);
  color:var(--muted);background:var(--plate);transition:background .25s;font-variant-numeric:tabular-nums}
.tag b{font-weight:600;color:var(--ink)}
.tag.hi{background:var(--accent-soft);color:var(--ink)}

.idea{grid-column:1/-1;border-top:2px solid var(--ink);padding:18px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.idea p{margin:0;flex:1 1 420px;min-width:0;font-size:16px;line-height:1.7;max-width:70ch}
.swatches{display:flex;align-items:center;gap:10px;font:600 12px var(--f-mono);letter-spacing:.12em;color:var(--muted)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--plate),0 0 0 5px var(--ink)}
.sw:focus-visible{outline:3px solid var(--ink);outline-offset:4px}

@media (max-width:820px){
  body{padding-block:12px}
  .plate{grid-template-columns:minmax(0,1fr);box-shadow:4px 4px 0 var(--ink)}
  .side{border-right:0;border-bottom:2px solid var(--ink);padding:18px 16px;gap:12px}
  h1{font-size:24px}
  .steps{flex-direction:row;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .step{flex:none}
  .note{display:none}
  .main{padding:16px}
  .caption{font-size:15px;min-height:5em}
  .stage{aspect-ratio:4/3.4}
  .lbl{font-size:17px}
  .idea{padding:16px}
  .idea p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.step,.tag,.caption{transition:none}}
</style>

<div class="plate">
  <aside class="side">
    <div class="fig">图 01 · 固定翼小飞机</div>
    <h1>一架小飞机</h1>
    <div class="steps" id="steps" role="tablist" aria-label="讲解步骤"></div>
    <button class="auto on" id="auto" type="button" aria-pressed="true"><i></i><span>自动讲解</span></button>
    <p class="note">示意机型与示意数据，不对应任何真实型号。可用 ← → 键切换步骤。</p>
  </aside>
  <section class="main">
    <p class="caption" id="caption" aria-live="polite"></p>
    <div class="stage" id="stage"><div class="layer" id="layer"></div></div>
    <div class="tags" id="tags"></div>
  </section>
  <footer class="idea">
    <p><b>核心原理：</b>飞机靠机翼产生<b>升力</b>，靠螺旋桨产生<b>推力</b>，靠副翼、升降舵、方向舵三组舵面控制<b>姿态</b>。升力大于重力就能离地，推力大于阻力就能加速。</p>
    <div class="swatches" id="swatches">涂装</div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const sm=x=>x*x*(3-2*x);
const seg=(t,a,b)=>sm(clamp((t-a)/(b-a)));
const D=Math.PI/180, REST=1.05, V3=THREE.Vector3;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer ---------- */
const stage=$('#stage'), layer=$('#layer');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
const DPR=Math.min(devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement,layer);
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,400);

scene.add(new THREE.HemisphereLight(0xffffff,0xd9ccb0,0.62));
const sun=new THREE.DirectionalLight(0xffffff,0.72);
sun.position.set(7,18,9); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:60}); sun.shadow.radius=4;
scene.add(sun);

const grad=new THREE.DataTexture(new Uint8Array([125,125,125,255,205,205,205,255,255,255,255,255]),3,1,THREE.RGBAFormat);
grad.minFilter=grad.magFilter=THREE.NearestFilter; grad.needsUpdate=true;

const INK=new THREE.Color(0x1c2333);
const outlineMat=new THREE.ShaderMaterial({side:THREE.BackSide,
  uniforms:{th:{value:1.5*DPR},res:{value:new THREE.Vector2(1,1)},col:{value:INK}},
  vertexShader:`uniform float th;uniform vec2 res;void main(){vec4 c=projectionMatrix*modelViewMatrix*vec4(position,1.);vec3 n=normalize(normalMatrix*normal);vec2 o=n.xy;float l=length(o);o=l>1e-4?o/l:vec2(0.);c.xy+=o*th*c.w*2./res;gl_Position=c;}`,
  fragmentShader:`uniform vec3 col;void main(){gl_FragColor=vec4(col,1.);}`});
const lineMat=new THREE.LineBasicMaterial({color:INK});

const accent=new THREE.Color('#f2b437');
const accentMats=[];   // materials whose color follows the livery/accent
function toon(color,o={}){return new THREE.MeshToonMaterial(Object.assign({color,gradientMap:grad},o));}
function make(geo,mat,{outline=true,edges=true,angle=32,shadow=true}={}){
  if(!(mat instanceof THREE.Material)) mat=toon(mat);
  const m=new THREE.Mesh(geo,mat); m.castShadow=shadow;
  if(outline) m.add(new THREE.Mesh(geo,outlineMat));
  if(edges) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,angle),lineMat));
  return m;
}
const H={wing:[],ail:[],elev:[],rud:[],engine:[],prop:[],panel:[],canopy:[]};
const hi=(k,m)=>{H[k].push(m.material);return m;};
function livery(){const m=toon(accent.clone());accentMats.push(m);return m;}
function anchor(p,x,y,z){const o=new THREE.Object3D();o.position.set(x,y,z);p.add(o);return o;}

/* ---------- colours ---------- */
const BODY=0xeeebe4, WINGC=0xe2dfd7, DARK=0x2b3140, ENG=0x5f6674, FIN=0x969ca7, TIRE=0x262b35;

/* ---------- aircraft ---------- */
const plane=new THREE.Group(); plane.rotation.order='YZX'; scene.add(plane);
const parts={};
function part(name,off,delay){const g=new THREE.Group();plane.add(g);parts[name]={g,off:new V3(...off),delay};return g;}

function lathe(profile,seg=32){const g=new THREE.LatheGeometry(profile.map(p=>new THREE.Vector2(p[0],p[1])),seg);g.rotateZ(-Math.PI/2);return g;}

// fuselage
const fus=part('fuselage',[0,0,0],0);
const fusGeo=lathe([[0.1,-4.25],[0.2,-3.8],[0.36,-3.0],[0.55,-2.0],[0.68,-1.0],[0.72,0],[0.72,1.0],[0.69,1.6],[0.66,1.86]]);
const fusM=make(fusGeo,BODY,{edges:false}); fusM.scale.z=0.92; fus.add(fusM);
const tub=make(new THREE.BoxGeometry(1.45,0.24,0.86),DARK,{outline:false}); tub.position.set(0.72,0.6,0); fus.add(tub);
// nose gear
{const s=make(new THREE.CylinderGeometry(0.045,0.045,0.42,8),FIN);s.position.set(1.72,-0.66,0);fus.add(s);
 const w=make(new THREE.CylinderGeometry(0.18,0.18,0.12,18),TIRE);w.rotation.x=Math.PI/2;w.position.set(1.72,-0.87,0);fus.add(w);}

// airfoil wing builder (TE at local x=0, LE at +chord, span along +z)
function airfoil(){const s=new THREE.Shape();
  const up=[[0,0.006],[0.22,0.05],[0.48,0.083],[0.7,0.088],[0.86,0.07],[0.96,0.04],[1,0]];
  const lo=[[0.96,-0.024],[0.86,-0.031],[0.6,-0.032],[0.3,-0.02],[0,-0.006]];
  s.moveTo(...up[0]);up.slice(1).forEach(p=>s.lineTo(...p));lo.forEach(p=>s.lineTo(...p));return s;}
function wingGeo(span,c0,c1,dih,th=1){
  const g=new THREE.ExtrudeGeometry(airfoil(),{depth:span,bevelEnabled:false,steps:1});
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const u=p.getX(i),y=p.getY(i),z=p.getZ(i),c=lerp(c0,c1,z/span);p.setXYZ(i,u*c,y*c*th+z*dih,z);}
  g.computeVertexNormals();return g;}

const WTE=-0.6, WY=-0.42, DIH=0.06, SPAN=4.6;
const ail={};
function buildWing(g,side){
  const w=hi('wing',make(wingGeo(SPAN,1.8,1.1,DIH),WINGC)); w.position.set(WTE,WY,0); g.add(w);
  const hinge=new THREE.Group(); hinge.position.set(WTE,WY+3.35*DIH+0.004,3.35); hinge.rotation.x=-Math.atan(DIH); g.add(hinge);
  const a=hi('ail',make(new THREE.BoxGeometry(0.38,0.045,1.75),WINGC)); a.position.x=-0.19; hinge.add(a); ail[side]=hinge;
  const nav=new THREE.Mesh(new THREE.SphereGeometry(0.08,12,8),new THREE.MeshBasicMaterial({color:side==='R'?0x35b86a:0xe0473c}));
  nav.position.set(WTE+0.55,WY+SPAN*DIH+0.01,SPAN+0.03); g.add(nav);
  const strut=make(new THREE.CylinderGeometry(0.045,0.045,0.5,8),FIN); strut.position.set(0.05,-0.62,1.3); g.add(strut);
  const wh=make(new THREE.CylinderGeometry(0.2,0.2,0.13,18),TIRE); wh.rotation.x=Math.PI/2; wh.position.set(0.05,-0.85,1.3); g.add(wh);
}
const wingR=part('wingR',[0,0.25,1.7],0.45); buildWing(wingR,'R');
const wingL=part('wingL',[0,0.25,-1.7],0.45); wingL.scale.z=-1; buildWing(wingL,'L');

// horizontal tail
const tailH=part('tailH',[-1.5,0.15,0],0.35);
for(const s of [1,-1]){const g=new THREE.Group();g.scale.z=s;tailH.add(g);
  const m=hi('wing',make(wingGeo(1.75,0.95,0.6,0,0.85),WINGC));m.position.set(-3.75,0.12,0);g.add(m);}
const elevH=new THREE.Group(); elevH.position.set(-3.75,0.12,0); tailH.add(elevH);
{const e=hi('elev',make(new THREE.BoxGeometry(0.4,0.04,3.4),WINGC));e.position.x=-0.2;elevH.add(e);}

// vertical tail
const tailV=part('tailV',[-1.5,0.95,0],0.3);
function shapeGeo(pts,depth){const s=new THREE.Shape();s.moveTo(...pts[0]);pts.slice(1).forEach(p=>s.lineTo(...p));
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false});g.translate(0,0,-depth/2);return g;}
tailV.add(hi('wing',make(shapeGeo([[-2.85,0.15],[-3.85,0.15],[-3.85,1.55],[-3.45,1.55]],0.08),WINGC)));
tailV.add(make(shapeGeo([[-3.309,1.22],[-3.85,1.22],[-3.85,1.555],[-3.45,1.555]],0.095),livery(),{outline:false}));
const rudH=new THREE.Group(); rudH.position.set(-3.85,0,0); tailV.add(rudH);
{const r=hi('rud',make(new THREE.BoxGeometry(0.4,1.3,0.07),WINGC));r.position.set(-0.2,0.9,0);rudH.add(r);
 const rt=make(new THREE.BoxGeometry(0.4,0.32,0.08),livery(),{outline:false});rt.position.set(-0.2,1.39,0);rudH.add(rt);}

// cowling
const cowl=part('cowling',[1.5,0.35,0],0.15);
cowl.add(make(lathe([[0.66,1.86],[0.66,2.1],[0.58,2.4],[0.44,2.6],[0.34,2.66]]),livery(),{edges:false}));

// propeller
const propP=part('prop',[2.7,0.35,0],0.1);
const spin=new THREE.Group(); spin.position.x=2.66; propP.add(spin);
{const c=hi('prop',make(new THREE.ConeGeometry(0.28,0.44,20),FIN,{edges:false}));c.rotation.z=-Math.PI/2;c.position.x=0.2;spin.add(c);
 for(const s of [1,-1]){const b=hi('prop',make(new THREE.BoxGeometry(0.05,1.05,0.17),DARK));b.position.set(0.05,s*0.62,0);b.rotation.y=0.38*s;spin.add(b);}}
const discMat=new THREE.MeshBasicMaterial({color:0x1c2333,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide});
const disc=new THREE.Mesh(new THREE.CircleGeometry(1.17,48),discMat); disc.rotation.y=Math.PI/2; disc.position.x=2.71; propP.add(disc);
const ringMat=new THREE.MeshBasicMaterial({color:accent.clone(),transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide});
const ring=new THREE.Mesh(new THREE.RingGeometry(1.12,1.19,64),ringMat); ring.rotation.y=Math.PI/2; ring.position.x=2.72; propP.add(ring);

// engine (flat four)
const engP=part('engine',[0.6,1.4,0],0.25);
const eng=new THREE.Group(); eng.position.set(2.2,0,0); engP.add(eng);
eng.add(hi('engine',make(new THREE.BoxGeometry(0.5,0.34,0.36),ENG)));
for(const dx of [-0.12,0.12]) for(const s of [1,-1]){
  const cy=hi('engine',make(new THREE.CylinderGeometry(0.1,0.1,0.26,14),ENG,{edges:false}));cy.rotation.x=Math.PI/2;cy.position.set(dx,0.02,s*0.31);eng.add(cy);
  for(let f=0;f<3;f++){const fin=make(new THREE.CylinderGeometry(0.135,0.135,0.018,16),FIN,{edges:false,outline:f===2});fin.rotation.x=Math.PI/2;fin.position.set(dx,0.02,s*(0.23+f*0.07));eng.add(fin);}}
{const sh=hi('engine',make(new THREE.CylinderGeometry(0.05,0.05,0.42,10),FIN,{edges:false}));sh.rotation.z=Math.PI/2;sh.position.x=0.42;eng.add(sh);}

// cockpit interior
const panelP=part('panel',[0,1.0,0],0.05);
const panel=make(new THREE.BoxGeometry(0.1,0.34,0.8),DARK); panel.position.set(1.3,0.86,0); panel.rotation.z=-0.22; panelP.add(panel);
const glare=make(new THREE.BoxGeometry(0.22,0.04,0.84),DARK); glare.position.set(1.33,1.04,0); panelP.add(glare);
function screenTex(){const c=document.createElement('canvas');c.width=256;c.height=184;const t=new THREE.CanvasTexture(c);t.anisotropy=4;return {c,ctx:c.getContext('2d'),t};}
const pfd=screenTex(), mfd=screenTex();
const scrMats=[];
for(const [s,z] of [[pfd,-0.2],[mfd,0.2]]){const m=new THREE.MeshBasicMaterial({map:s.t,color:0x222222});scrMats.push(m);H.panel.push(m);
  const q=new THREE.Mesh(new THREE.PlaneGeometry(0.34,0.245),m);q.rotation.y=-Math.PI/2;q.position.set(-0.052,0.0,z);panel.add(q);}
for(const x of [0.2,-0.45]){const sb=make(new THREE.BoxGeometry(0.1,0.42,0.46),0x3d4556);sb.position.set(x,0.86,0);sb.rotation.z=0.18;panelP.add(sb);
  const sc=make(new THREE.BoxGeometry(0.42,0.08,0.46),0x3d4556);sc.position.set(x+0.2,0.68,0);panelP.add(sc);}
const stick=make(new THREE.CylinderGeometry(0.025,0.025,0.32,8),DARK); stick.position.set(0.72,0.84,0); panelP.add(stick);

// canopy (hinged at rear)
const canP=part('canopy',[0,1.75,0],0);
const canPivot=new THREE.Group(); canPivot.position.set(-0.08,0.62,0); canP.add(canPivot);
const canG=new THREE.Group(); canG.position.set(0.82,0,0); canG.scale.set(0.84,0.5,0.52); canPivot.add(canG);
const glassMat=toon(0xa9cde4,{transparent:true,opacity:0.42,depthWrite:false}); H.canopy.push(glassMat);
const glass=new THREE.Mesh(new THREE.SphereGeometry(1,32,14,0,Math.PI*2,0,Math.PI/2),glassMat); canG.add(glass);
const frameMat=toon(DARK);
{const rim=new THREE.Mesh(new THREE.TorusGeometry(1,0.06,6,48),frameMat);rim.rotation.x=Math.PI/2;canG.add(rim);
 const arch=new THREE.Mesh(new THREE.TorusGeometry(1,0.05,6,32,Math.PI),frameMat);arch.rotation.y=Math.PI/2;arch.position.x=-0.15;canG.add(arch);}

/* ---------- overlays attached to the aircraft ---------- */
function arrow(len,mat){const g=new THREE.Group();
  const sg=new THREE.CylinderGeometry(0.07,0.07,len-0.38,12),hg=new THREE.ConeGeometry(0.2,0.38,16);

function desired(i,t){return Object.assign({},BASE,STEPS[i].fn(t));}
function buildLabels(){layer.textContent='';labels=(STEPS[stepIdx].labels||[]).map(L=>{const el=document.createElement('div');
  el.className='lbl'+(L.hot?' hot':'')+(L.cls?' '+L.cls:'');layer.appendChild(el);return Object.assign({el,lastText:''},L);});}
function go(i,user){if(user)setAuto(false);stepIdx=(i+STEPS.length)%STEPS.length;stepT=0;snap=Object.assign({},cur);buildLabels();
  btns.forEach((b,j)=>{b.classList.toggle('on',j===stepIdx);b.setAttribute('aria-selected',j===stepIdx?'true':'false');b.querySelector('.bar').style.width='0';});
  if(user)btns[stepIdx].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  capEl.textContent=STEPS[stepIdx].cap;}
cur=desired(0,0); go(0,false);

/* ---------- screens ---------- */
function drawPFD(roll,pitch,t){const g=pfd.ctx,w=256,h=184;g.save();g.fillStyle='#0b0f16';g.fillRect(0,0,w,h);
  g.beginPath();g.rect(4,4,w-8,h-8);g.clip();g.translate(w/2,h/2-6);g.rotate(-roll);const py=pitch*3.2;
  g.fillStyle='#3a7fc6';g.fillRect(-320,-320+py,640,320);g.fillStyle='#8a5a2c';g.fillRect(-320,py,640,320);
  g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(-320,py);g.lineTo(320,py);g.stroke();
  g.lineWidth=1.5;for(const p of [-20,-10,10,20]){const y=py-p*3.2;const l=Math.abs(p)===10?22:34;g.beginPath();g.moveTo(-l,y);g.lineTo(l,y);g.stroke();}
  g.restore();g.strokeStyle='#ffd23f';g.lineWidth=4;g.beginPath();g.moveTo(w/2-44,h/2-6);g.lineTo(w/2-14,h/2-6);g.lineTo(w/2,h/2+4);g.lineTo(w/2+14,h/2-6);g.lineTo(w/2+44,h/2-6);g.stroke();
  g.fillStyle='rgba(8,11,17,.78)';g.fillRect(6,26,44,118);g.fillRect(w-52,26,46,118);g.fillRect(70,h-26,116,22);
  g.fillStyle='#e9f1ff';g.font='bold 16px "JetBrains Mono",monospace';g.textAlign='center';
  g.fillText(String(Math.round(105+Math.sin(t*0.7)*2)),28,91);g.fillText(String(1500+Math.round(Math.sin(t*0.4)*20)),w-29,91);
  g.font='12px "JetBrains Mono",monospace';g.fillText('HDG 090',128,h-10);g.fillStyle='#7ee08f';g.fillText('IAS',28,40);g.fillText('ALT',w-29,40);
  pfd.t.needsUpdate=true;}
function drawMFD(t){const g=mfd.ctx,w=256,h=184;g.fillStyle='#0b0f16';g.fillRect(0,0,w,h);
  g.strokeStyle='#2b3546';g.lineWidth=1;for(let x=130;x<w;x+=20){g.beginPath();g.moveTo(x,8);g.lineTo(x,h-8);g.stroke();}for(let y=8;y<h;y+=20){g.beginPath();g.moveTo(130,y);g.lineTo(w-8,y);g.stroke();}
  g.strokeStyle='#e98bf0';g.lineWidth=3;g.beginPath();g.moveTo(150,160);g.lineTo(190,110);g.lineTo(230,70);g.lineTo(240,30);g.stroke();
  const pp=(t*0.08)%1;g.fillStyle='#fff';g.beginPath();const px=150+pp*80,py=160-pp*90;g.arc(px,py,5,0,7);g.fill();
  g.lineWidth=8;g.strokeStyle='#2b3546';g.beginPath();g.arc(62,66,38,Math.PI*0.75,Math.PI*2.25);g.stroke();
  const v=0.72+Math.sin(t*1.3)*0.03;g.strokeStyle='#47d16b';g.beginPath();g.arc(62,66,38,Math.PI*0.75,Math.PI*(0.75+1.5*v));g.stroke();
  g.fillStyle='#e9f1ff';g.textAlign='center';g.font='bold 16px "JetBrains Mono",monospace';g.fillText(String(Math.round(2400+Math.sin(t*1.3)*90)),62,72);
  g.font='11px "JetBrains Mono",monospace';g.fillStyle='#7ee08f';g.fillText('RPM',62,118);
  for(const [i,lab,val] of [[0,'FUEL L',0.8],[1,'FUEL R',0.76],[2,'OIL',0.6]]){const y=134+i*16;g.fillStyle='#9aa6b8';g.textAlign='left';g.fillText(lab,12,y+8);
    g.fillStyle='#2b3546';g.fillRect(64,y,56,8);g.fillStyle='#47d16b';g.fillRect(64,y,56*val,8);}
  mfd.t.needsUpdate=true;}

/* ---------- resize ---------- */
const tmp=new V3();
let W=1,Hh=1;
function resize(){const r=stage.getBoundingClientRect();W=Math.max(1,r.width);Hh=Math.max(1,r.height);renderer.setSize(W,Hh,false);
  const asp=W/Hh,half=Math.max(5.6,9.4/asp);cam.left=-half*asp;cam.right=half*asp;cam.top=half;cam.bottom=-half;cam.updateProjectionMatrix();
  renderer.getDrawingBufferSize(outlineMat.uniforms.res.value);}
new ResizeObserver(resize).observe(stage); resize();

/* ---------- frame ---------- */
const dirV=new V3();
function setHi(key,v){const pulse=v*(0.78+0.22*Math.sin(clock*6));for(const m of H[key]){if(m.emissive)m.emissive.setRGB(accent.r*pulse*0.6,accent.g*pulse*0.6,accent.b*pulse*0.6);}}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;stepT+=dt;
  const st=STEPS[stepIdx];
  if(auto&&stepT>st.dur+1.4){go(stepIdx+1,false);}
  const d=desired(stepIdx,stepT),b=sm(clamp(stepT/BLEND));
  for(const k in d)cur[k]=lerp(snap[k],d[k],b);
  const S=cur;

  plane.position.set(S.px,S.py,S.pz); plane.rotation.set(S.roll*D,S.yaw,S.pitch*D);
  canPivot.rotation.z=S.canopy*0.95;
  for(const n in parts){const p=parts[n];const k=sm(clamp(S.explode*1.6-p.delay));p.g.position.copy(p.off).multiplyScalar(k);}
  ail.R.rotation.z=-S.ail*0.45; ail.L.rotation.z=S.ail*0.45; elevH.rotation.z=-S.elev*0.5; rudH.rotation.y=-S.rud*0.5;
  propAngle+=S.prop*dt; spin.rotation.x=propAngle;
  const blur=clamp((S.prop-10)/18); discMat.opacity=blur*0.16; ringMat.opacity=blur*0.8; disc.visible=ring.visible=blur>0.01;
  // flow
  flow.visible=S.flow>0.01; if(flow.visible){for(const m of flowLines)m.opacity=S.flow*0.45;
    for(const o of dots){o.u=(o.u+o.speed*dt)%1;o.curve.getPointAt(o.u,o.d.position);o.dm.opacity=S.flow*Math.min(1,Math.sin(o.u*Math.PI)*3);}}
  liftA.visible=weightA.visible=S.lift>0.01; liftA.scale.set(1,Math.max(0.01,S.lift),1); weightA.scale.set(1,Math.max(0.01,S.lift),1);
  for(const [g,v] of [[arcRoll,S.arcRoll],[arcPitch,S.arcPitch],[arcYaw,S.arcYaw]]){g.visible=v>0.02;g.scale.setScalar(Math.max(0.01,v));}
  setHi('wing',S.hiWing);setHi('ail',S.hiAil);setHi('elev',S.hiElev);setHi('rud',S.hiRud);setHi('engine',S.hiEngine);setHi('prop',S.hiProp);setHi('canopy',S.hiCanopy);
  for(const m of scrMats)m.color.setScalar(0.13+0.87*S.glow+0.15*S.hiPanel*Math.sin(clock*6));
  if(S.glow>0.01){drawPFD(Math.sin(clock*0.6)*0.12,Math.sin(clock*0.45)*3,clock);drawMFD(clock);}
  sock.userData.arm.rotation.y=0.35+Math.sin(clock*1.3)*0.12; sock.userData.arm.rotation.z=-0.08+Math.sin(clock*2.1)*0.04;

  // camera
  const az=S.az*D,el=S.el*D; dirV.set(Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az));
  cam.position.set(S.tx,S.ty,S.tz).addScaledVector(dirV,80); cam.lookAt(S.tx,S.ty,S.tz); cam.zoom=S.zoom; cam.updateProjectionMatrix();
  scene.updateMatrixWorld();

  // labels
  for(const L of labels){let o=seg(stepT,L.t0,L.t0+0.35);if(L.t1!=null)o*=1-seg(stepT,L.t1-0.35,L.t1);
    if(o<0.01){if(L.el.style.opacity!=='0')L.el.style.opacity='0';continue;}
    const txt=typeof L.text==='function'?L.text(stepT):L.text; if(txt!==L.lastText){L.el.textContent=txt;L.lastText=txt;}
    L.a.getWorldPosition(tmp).project(cam);const x=(tmp.x+1)/2*W,y=(1-tmp.y)/2*Hh;
    L.el.style.opacity=o.toFixed(3);L.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;}

  // tags
  const T=st.tags?st.tags(stepT,S):{};
  for(const k in tagEls){const te=tagEls[k];let v=te.def,h=false;
    if(k==='att')v=S.py>REST+0.3?'飞行':'停放';
    if(T[k]){if(T[k][0])v=T[k][0];h=!!T[k][1];}
    const key=v+'|'+h;if(key!==te.last){te.last=key;te.b.textContent=v;te.e.classList.toggle('hi',h);}}
  btns[stepIdx].querySelector('.bar').style.width=(clamp(stepT/st.dur)*100).toFixed(1)+'%';

  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__plane={go:i=>go(i,true),seek:t=>{stepT=t;}};
})();
</script>
